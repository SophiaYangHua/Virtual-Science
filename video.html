<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷视频 · Virtual Science期刊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    background: #fff;
    color: #212121;
  }
  .video-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 20px;
    border-bottom: 1px solid #d9d9d9;
    background: #fff;
    flex-shrink: 0;
  }
  .brand {
    font-family: Georgia, "Times New Roman", "Noto Serif SC", "SimSun", serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: #111;
    text-decoration: none;
    white-space: nowrap;
  }
  .brand .mark {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 4px;
    background: #c00;
  }
  .brand:hover { color: #111; }
  .video-title {
    flex: 1;
    text-align: center;
    font-size: 0.9rem;
    color: #767676;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .actions { display: flex; gap: 12px; align-items: center; white-space: nowrap; }
  .actions a {
    font-size: 0.85rem;
    color: #595959;
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    transition: all 0.15s ease;
  }
  .actions a:hover { color: #c00; border-color: #c00; }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: #000;
  }
  @media (max-width: 640px) {
    .video-title { display: none; }
    .actions a span.open-text { display: none; }
  }
</style>
</head>
<body>
  <header class="video-header">
    <a class="brand" href="./">Virtual Science<span class="mark"></span>期刊</a>
    <span class="video-title">刷视频 · 随机视频推荐（三源轮询防卡顿）</span>
    <div class="actions">
      <a href="./">← 返回期刊</a>
      <a href="https://sophiayanghua.github.io/SophiaVideo/" target="_blank" rel="noopener">↗ <span class="open-text">新窗口打开</span></a>
    </div>
  </header>
  <iframe
    src="https://sophiayanghua.github.io/SophiaVideo/"
    title="Sophia 随机视频"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>
</body>
</html>
