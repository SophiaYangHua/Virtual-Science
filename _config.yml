# Site settings
title: "Virtual Science期刊"
description: "一份关于科学与技术的开放期刊——发表研究、思考与发现"
url: "https://sophiayanghua.github.io"
baseurl: "/Virtual-Science"

# Theme
theme: minima

minima:
  social_links:
    - { platform: github, user_url: "https://github.com/SophiaYangHua" }

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Language
language: "zh-CN"

# Author（minima 主题使用字符串格式）
author: "Sophia Yanghua"
author_email: "3570553727@qq.com"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md